line-length = 79
indent-width = 4
target-version = "py37"

[format]
quote-style = "preserve"
indent-style = "space"
line-ending = "lf"

[lint]
select = [
    "A",        # flake8-builtins
    "B",        # flake8-bugbear
    "C4",       # flake8-comprehensions
    "E",        # pycodestyle: error
    "EXE",      # flake8-executable
    "F",        # Pyflakes
    "FURB",     # refurb
    "ICN",      # flake8-import-conventions
    "PERF",     # Perflint
    "PIE",      # flake8-pie
    "PL",       # Pylint
    "PYI",      # flake8-pyi
    "Q",        # flake8-quotes
    "RET",      # flake8-return
    "RSE",      # flake8-raise
    "RUF",      # Ruff-specific rules
    "S",        # flake8-bandit
    "SIM",      # flake8-simplify
    "SLF",      # flake8-self
    "TRY",      # tryceratops
    "W"         # pycodestyle: warning
]
ignore = [
    "C405",         # unnecessary-literal-set
    "C408",         # unnecessary-collection-call
    "E402",         # module-import-not-at-top-of-file
    "PERF203",      # try-except-in-loop
    "PERF401",      # manual-list-comprehension
    "PERF403",      # manual-dict-comprehension
    "PLC0415",      # import-outside-top-level
    "PLR2004",      # magic-value-comparison
    "RET504",       # unnecessary-assign
    "RET505",       # superfluous-else-return
    "RUF005",       # collection-literal-concatenation
    "RUF012",       # mutable-class-default
    "RUF059",       # unused-unpacked-variable
    "S104",         # hardcoded-bind-all-interfaces
    "S110",         # try-except-pass
    "S112",         # try-except-continue
    "S310",         # suspicious-url-open-usage
    "S603",         # subprocess-without-shell-equals-true
    "S607",         # start-process-with-partial-path
    "SIM103",       # needless-bool
    "SIM105",       # suppressible-exception
    "SIM108",       # if-else-block-instead-of-if-exp
    "SIM116",       # if-else-block-instead-of-dict-lookup
    "TRY003",       # raise-vanilla-args
    "TRY300",       # try-consider-else
    "TRY301",       # raise-within-try
]

[lint.per-file-ignores]
"natter-docker/**.py" = [
    "T201"          # print
]
"micropython/**.py" = [
    "A",            # flake8-builtins
    "PLR09",        # too-many-x
    "SLF",          # flake8-self
    "F403",         # undefined-local-with-import-star
    "F405"          # undefined-local-with-import-star-usage
]
"micropython/**/argparse.py" = [
    "S101",         # assert
    "SIM102",       # collapsible-if
    "B904",         # raise-without-from-inside-except
    "PLW1641",      # eq-without-hash
    "PLC0206",      # dict-index-missing-items
    "TRY004",       # type-check-without-type-error
    "PLR1704",      # redefined-argument-from-local
    "B006",         # mutable-argument-default
    "B007",         # unused-loop-control-variable
    "PLW2901"       # redefined-loop-name
]
"micropython/**/_manifest.py" = [
    "F821"          # undefined-name
]

[lint.flake8-quotes]
avoid-escape = false
inline-quotes = "double"
docstring-quotes = "single"
multiline-quotes = "single"

[lint.pylint]
max-returns = 16        # PLR0911
max-branches = 16       # PLR0912
max-args = 10           # PLR0913
max-locals = 16         # PLR0914
max-statements = 80     # PLR0915
max-bool-expr = 5       # PLR0916
